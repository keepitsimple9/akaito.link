<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Proyecto Akaito</title>
    <link rel="icon" type="image/png" href="img/logo_akaito.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/i18n.js"></script>
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="index.html" class="logo" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px;">
                <img src="img/logo_akaito.svg" alt="Proyecto Akaito" style="height: 40px; width: auto;">
                <span>Proyecto Akaito</span>
            </a>
            <div style="display: flex; align-items: center; gap: 15px;">
                <select id="languageSelector" style="padding: 5px; border: 1px solid #ddd; border-radius: 4px; background: white; cursor: pointer;" onchange="changeLanguage(this.value)">
                    <option value="es">ES</option>
                    <option value="ja">日本語</option>
                </select>
                <span class="badge">Acceso Miembros</span>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="form-section" style="padding: 60px 0;">
            <h2 style="text-align: center; margin-bottom: 10px; font-weight: 600;">❤️ Ingresar a la Comunidad ❤️</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px; font-weight: 300;">
                Digita tus credenciales para acceder a tu panel de Akaito.
            </p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Correo Electrónico:</label>
                    <input type="email" id="loginEmail" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña:</label>
                    <input type="password" id="loginPassword" required placeholder="Tu contraseña">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
            </form>

            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
                ¿Aún no postulas? <a href="registro.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">Postula aquí</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Proyecto Akaito. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/init.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/translate.js"></script>
</body>
</html>
