<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - Proyecto Akaito</title>
    <link rel="icon" type="image/png" href="img/logo_akaito.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/i18n.js"></script>
</head>
<body>
    <button id="btnThemeGlobal" class="theme-toggle-global" type="button" aria-label="Alternar modo nocturno o diurno">🌙 Nocturno</button>

    <header>
        <div class="container header-content">
            <a href="index.html" class="logo" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px;">
                <img src="img/logo_akaito.svg" alt="Proyecto Akaito" style="height: 40px; width: auto;">
                <span>Proyecto Akaito</span>
            </a>
            <span class="badge">Seguridad</span>
        </div>
    </header>

    <main class="container">
        <section class="form-section" style="padding: 60px 0;">
            <h2 style="text-align: center; margin-bottom: 10px; font-weight: 600;">Crear nueva contraseña</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px; font-weight: 300;">
                Ingresa tu nueva contraseña y repítela para confirmar.
            </p>

            <form id="newPasswordForm">
                <div class="form-group">
                    <label for="newPassword">Nueva contraseña:</label>
                    <input type="password" id="newPassword" minlength="6" required placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label for="repeatPassword">Repetir nueva contraseña:</label>
                    <input type="password" id="repeatPassword" minlength="6" required placeholder="Repite tu nueva contraseña">
                </div>

                <p id="errorPassword" style="display: none; margin: -4px 0 14px 0; color: #bd1f36; font-size: 0.9rem; font-weight: 600;">
                    Las contraseñas no coinciden.
                </p>

                <button type="submit" class="btn btn-primary btn-block">Guardar nueva contraseña</button>
            </form>

            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
                <a href="login.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">Volver a iniciar sesión</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Proyecto Akaito. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/translate.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
